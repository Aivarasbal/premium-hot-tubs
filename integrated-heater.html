<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrated wood-fired heater | Garden Spa</title>
<meta name="description" content="The stove is built into the hot tub.">
<link rel="canonical" href="https://partners.premiumkubilai.lt/integrated-heater.html">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f2ec;color:#17251f;font:16px/1.6 Arial,sans-serif}
main{width:min(1080px,90%);margin:auto;padding:32px 0 56px}
a{color:#263b31}
h1{font:normal clamp(34px,6vw,58px)/1.15 Georgia,serif;margin-bottom:.3em}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,145px),1fr));max-width:680px;gap:14px;margin:28px 0}
.gallery a{display:block;background:#fff;cursor:zoom-in;border-radius:4px;overflow:hidden}
.gallery img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain}
.gallery a:focus-visible,.photo-viewer button:focus-visible{outline:3px solid #597b69;outline-offset:-3px}
.photo-viewer{box-sizing:border-box;max-width:94vw;max-height:96vh;padding:10px;border:0;border-radius:6px;background:#17251f;color:#fff}
.photo-viewer::backdrop{background:rgba(0,0,0,.82)}
.photo-viewer img{display:block;max-width:100%;max-height:calc(96vh - 120px);width:auto;height:auto;margin:auto}
.photo-viewer button{display:block;margin:0 0 8px auto;min-height:38px;padding:4px 12px;background:#fff;color:#17251f;border:0;border-radius:3px;font:inherit;cursor:pointer}
@media(max-width:360px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.photo-controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px}
.photo-controls button{margin:0}
</style>
</head>
<body>
<main>
<a href="./#products">Back to Garden Spa products</a>
<h1>Integrated wood-fired heater</h1>
<p>The stove is built into the hot tub</p>
<div class="gallery">
<a href="images/integrated-front.webp"><img loading="lazy" src="images/integrated-front.webp" alt="Front view of the integrated firebox and stainless-steel chimney" width="1100" height="535" decoding="async"></a>

<a href="images/integrated-side.webp"><img loading="lazy" src="images/integrated-side.webp" alt="Side view of the hot tub with the integrated heater and matching steps" width="1100" height="535" decoding="async"></a>

<a href="images/integrated-chimney.webp"><img loading="lazy" src="images/integrated-chimney.webp" alt="Vertical view of the integrated heater and full chimney" width="535" height="1100" decoding="async"></a>

<a href="images/integrated-interior.webp"><img src="images/integrated-interior.webp" alt="White hot tub liner with contoured seating and jets against a dark gray background" width="1100" height="535" loading="lazy" decoding="async"></a>

</div>
<a href="./#contact">Request trade pricing</a>
</main>
<dialog class="photo-viewer" id="photo-viewer" aria-label="Enlarged product photo">
  <form method="dialog"><button autofocus>Close</button></form>
  <img alt="">
  <div class="photo-controls">
    <button type="button" id="previous-photo">Previous</button>
    <span id="photo-count" aria-live="polite"></span>
    <button type="button" id="next-photo">Next</button>
  </div>
</dialog>
<script>
  const gallery = document.querySelector('.gallery');
  const viewer = document.querySelector('#photo-viewer');
  const photo = viewer.querySelector('img');
  const links = Array.from(gallery.querySelectorAll('a'));
  const count = viewer.querySelector('#photo-count');
  let current = 0;

  function showPhoto(index) {
    current = (index + links.length) % links.length;
    const link = links[current];
    photo.src = link.href;
    photo.alt = link.querySelector('img').alt;
    count.textContent = (current + 1) + ' / ' + links.length;
  }

  viewer.querySelector('#previous-photo').addEventListener('click', () => showPhoto(current - 1));
  viewer.querySelector('#next-photo').addEventListener('click', () => showPhoto(current + 1));
  viewer.addEventListener('keydown', (event) => {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    showPhoto(current + (event.key === 'ArrowLeft' ? -1 : 1));
  });
  gallery.addEventListener('click', (event) => {
    const link = event.target.closest('a');
    if (!link || !viewer.showModal || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    showPhoto(links.indexOf(link));
    viewer.showModal();
  });
  viewer.addEventListener('click', (event) => {
    if (event.target !== viewer) return;
    const {left, right, top, bottom} = viewer.getBoundingClientRect();
    if (event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom) viewer.close();
  });
</script>
</body>
</html>
